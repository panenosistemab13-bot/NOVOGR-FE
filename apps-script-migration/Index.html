<!doctype html>
<html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--wine:#7e0a16;--wine2:#9a1b29;--gold:#b78a3b;--ink:#30271f;--muted:#82786c;--paper:#f3eee5;--card:#fffdf9;--line:#e7ddcf}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Inter,Arial,sans-serif}
header{height:66px;background:#fffdf9;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#d8b76c,#98702c);display:grid;place-items:center;color:white;font-weight:900;font-size:17px;box-shadow:0 3px 10px #9b792c33}
.brand strong{display:block;font-size:14px;letter-spacing:.3px}.brand small{font-size:9px;letter-spacing:1.5px;color:#977432;font-weight:800}
.user{font-size:12px;color:var(--muted)}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 66px)}
aside{background:#fffaf3;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:5px}
.nav-label{font-size:9px;font-weight:800;letter-spacing:1.4px;color:#a39787;padding:12px 10px 6px;text-transform:uppercase}
.nav{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:#655747;cursor:pointer;font:600 12px Inter,Arial;display:flex;gap:10px;align-items:center}
.nav:hover,.nav.active{background:#f0e5d4;color:var(--wine)}.nav .dot{width:7px;height:7px;border-radius:50%;background:#c3a56c}
main{padding:26px;min-width:0;max-width:1600px;width:100%;margin:0 auto}
.eyebrow{color:#a07b37;font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}
h1{font-size:25px;margin:6px 0 5px;letter-spacing:-.5px}.sub{color:var(--muted);margin:0 0 22px;font-size:12px}
.hero{background:linear-gradient(110deg,#64101a,#8b1825 65%,#a27a37);color:white;border-radius:18px;padding:25px 28px;margin-bottom:22px;box-shadow:0 12px 30px #5e111a20;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:240px;height:240px;border:1px solid #ffffff25;border-radius:50%;right:-45px;top:-90px;box-shadow:0 0 0 24px #ffffff08,0 0 0 50px #ffffff06}
.hero small{font-size:10px;letter-spacing:2px;color:#e6cb8a;font-weight:800}.hero h2{font-size:24px;margin:9px 0}.hero p{color:#f1e3d7;margin:0;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat,.tile,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px #59452b08}
.stat{padding:16px}.stat small{color:var(--muted);font-size:10px;font-weight:700}.stat strong{display:block;color:var(--wine);font-size:25px;margin-top:7px}
.section-title{font-size:14px;font-weight:800;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{padding:16px;text-align:left;cursor:pointer;transition:.16s;border-color:var(--line);color:var(--ink)}.tile:hover{transform:translateY(-2px);border-color:#c9ad79;box-shadow:0 8px 20px #59452b12}
.tile .symbol{width:34px;height:34px;border-radius:10px;background:#f2e8d8;color:var(--wine);display:grid;place-items:center;font-size:16px;margin-bottom:12px}
.tile strong{display:block;font-size:12px}.tile small{display:block;color:var(--muted);font-size:10px;line-height:1.5;margin-top:5px}.tile em{font-style:normal;color:#a17a34;font-size:10px;font-weight:800;display:block;margin-top:10px}
.toolbar{display:flex;gap:8px;align-items:center;margin:16px 0}.search{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 12px;min-width:220px;outline:none}.btn{border:0;border-radius:9px;background:var(--wine);color:white;padding:10px 14px;font-weight:700;cursor:pointer}
.panel{overflow:hidden}.panel-head{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:800}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #eee7dd;font-size:11px}th{background:#faf5ed;color:#796b5b;font-size:9px;text-transform:uppercase;letter-spacing:1px}td{color:#514638}.empty{padding:32px;text-align:center;color:var(--muted)}
#login{max-width:460px;margin:12vh auto;background:white;border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;box-shadow:0 15px 45px #49331b12}#login .mark{margin:0 auto 14px}#error{color:#a21c2a;font-size:12px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){header{padding:0 14px}.shell{grid-template-columns:1fr}aside{flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.nav-label{display:none}.nav{white-space:nowrap;padding:10px}.nav .dot{display:none}main{padding:17px 13px}.tiles{grid-template-columns:1fr 1fr}.stats{gap:8px}.stat{padding:12px}.hero{padding:20px}.hero h2{font-size:20px}}
</style></head><body>
<header><div class="brand"><div class="mark">3C</div><div><strong>NOVOGR-FE</strong><small>CENTRAL GR · LOGISTICS NETWORK</small></div></div><div class="user" id="userLabel">Validando acesso…</div></header>
<section id="login" hidden><div class="mark">3C</div><h2>Acesso ao sistema</h2><p id="error">Verificando a conta Google autorizada…</p></section>
<div class="shell" id="app" hidden><aside id="nav"></aside><main id="content"></main></div>
<script>
let state={pages:[],counts:{},active:'menu',user:null};
const symbols={menu:'⌂',checklist:'✓',averbacao:'▤',sm_creator:'◉',lancamento:'＋',controle:'⌘',cadastro:'♙',settings:'⚙',escala:'▦',disponibilidade:'▣',ordem_servico:'▤',cobrancas:'$',lista_emails:'✉',calendario:'▦',presence:'♧',rotas:'⇢',historico:'◷'};
function start(){google.script.run.withSuccessHandler(init).withFailureHandler(showError).getInitialData();}
function init(data){state.pages=data.pages||[];state.counts=data.counts||{};state.user=data.user||{};document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;document.getElementById('userLabel').textContent=(state.user.name||state.user.email||'Usuário')+' · '+(state.user.role||'');render();}
function showError(e){document.getElementById('app').hidden=true;document.getElementById('login').hidden=false;document.getElementById('error').textContent=e.message||String(e);}
function render(){renderNav();if(state.active==='menu')renderHome();else renderPage(state.active);}
function renderNav(){const nav=document.getElementById('nav');nav.innerHTML='<div class="nav-label">Navegação</div>'+state.pages.map(p=>'<button class="nav '+(state.active===p.id?'active':'')+'" onclick="go(\''+p.id+'\')"><span class="dot"></span>'+esc(p.label)+'</button>').join('');}
function go(id){state.active=id;render();}
function renderHome(){const pages=state.pages.filter(p=>p.id!=='menu');const total=Object.values(state.counts).reduce((a,b)=>a+Number(b||0),0);document.getElementById('content').innerHTML='<div class="eyebrow">Central de operações</div><h1>Visão geral operacional</h1><p class="sub">Acesso aos módulos e acompanhamento dos registros do sistema.</p><section class="hero"><small>NOVOGR-FE · CENTRAL GR</small><h2>Gestão operacional integrada</h2><p>Ambiente de trabalho e navegação dos módulos operacionais.</p></section><section class="stats"><div class="stat"><small>MÓDULOS DISPONÍVEIS</small><strong>'+pages.length+'</strong></div><div class="stat"><small>REGISTROS NO BANCO</small><strong>'+total+'</strong></div><div class="stat"><small>USUÁRIO</small><strong style="font-size:15px">'+esc(state.user.name||'Autenticado')+'</strong></div><div class="stat"><small>PERFIL</small><strong style="font-size:15px">'+esc(state.user.role||'')+'</strong></div></section><h3 class="section-title">Módulos do aplicativo</h3><section class="tiles">'+pages.map(p=>'<button class="tile" onclick="go(\''+p.id+'\')"><span class="symbol">'+(symbols[p.id]||'•')+'</span><strong>'+esc(p.label)+'</strong><small>'+esc(p.description||'Abrir módulo operacional')+'</small><em>'+(state.counts[p.id]||0)+' registros</em></button>').join('')+'</section>';}
function renderPage(id){const p=state.pages.find(x=>x.id===id);if(!p){renderHome();return;}document.getElementById('content').innerHTML='<div class="eyebrow">'+esc(p.category||'Módulo')+'</div><h1>'+esc(p.label)+'</h1><p class="sub">'+esc(p.description||'')+'</p><div class="toolbar"><input id="q" class="search" placeholder="Pesquisar nos registros…" oninput="filterRows()"><button class="btn" onclick="loadRows()">Atualizar</button></div><section class="panel"><div class="panel-head">Registros · '+esc(p.label)+'</div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Status</th><th>Data de criação</th><th>Responsável</th><th>Dados</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Carregando registros…</td></tr></tbody></table></div></section>';loadRows();}
let currentRows=[];
function loadRows(){const p=state.pages.find(x=>x.id===state.active);if(!p||!p.table){document.getElementById('rows').innerHTML='<tr><td colspan="5" class="empty">Esta área ainda será ligada ao fluxo específico do módulo.</td></tr>';return;}google.script.run.withSuccessHandler(rows=>{currentRows=rows||[];drawRows(currentRows);}).withFailureHandler(e=>{document.getElementById('rows').innerHTML='<tr><td colspan="5" class="empty">'+esc(e.message)+'</td></tr>';}).listRecords(p.table);}
function filterRows(){const q=(document.getElementById('q').value||'').toLowerCase();drawRows(currentRows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)));}
function drawRows(rows){const body=document.getElementById('rows');if(!rows.length){body.innerHTML='<tr><td colspan="5" class="empty">Nenhum registro encontrado.</td></tr>';return;}body.innerHTML=rows.map(r=>'<tr><td>'+esc(r.id)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.created)+'</td><td>'+esc(r.user)+'</td><td>'+esc(JSON.stringify(r.data||{}))+'</td></tr>').join('');}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
start();
</script></body></html>
