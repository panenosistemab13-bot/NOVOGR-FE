<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#101722;color:#e8edf5;font-family:Arial}header{padding:18px 24px;background:#182536;border-bottom:1px solid #bd8b2e;color:#f5c65b}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px}button{background:#22344b;border:1px solid #52647a;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}main{padding:20px}article{background:#192534;border:1px solid #33455b;border-radius:14px;padding:20px}</style></head><body><header><strong>NOVOGR-FE · MIGRAÇÃO GAS</strong><div id="status">Inicializando…</div></header><nav id="nav"></nav><main><article><h2 id="title">Painel</h2><p id="msg">Estrutura técnica de migração inicial. Módulos ainda em portabilidade.</p><pre id="data"></pre></article></main><script>google.script.run.withSuccessHandler(d=>{document.getElementById('status').textContent='Base GAS conectada';d.modules.forEach(m=>{let b=document.createElement('button');b.textContent=m;b.onclick=()=>{document.getElementById('title').textContent=m;google.script.run.withSuccessHandler(rows=>document.getElementById('data').textContent=JSON.stringify(rows,null,2)).listRecords(m)};document.getElementById('nav').appendChild(b)})}).getInitialData();</script></body></html>
