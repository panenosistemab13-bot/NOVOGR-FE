<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#111a27;color:#e8edf5;font-family:Inter,Arial,sans-serif}header{padding:20px 25px;background:#19283b;border-bottom:1px solid #c49a45;color:#f3ca67}#login{max-width:580px;margin:10vh auto;padding:30px;background:#1a2738;border:1px solid #40536a;border-radius:18px;box-shadow:0 15px 45px #0005}#app{display:none}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px}button{background:#24374f;border:1px solid #53667d;color:white;padding:10px 14px;border-radius:10px;cursor:pointer}button:hover{border-color:#e3b44d}main{padding:20px}article{background:#192534;border:1px solid #33455b;border-radius:14px;padding:20px}small{color:#b7c4d5}.err{color:#ffb6b6}</style></head><body><header><strong>NOVOGR-FE · MIGRAÇÃO GAS</strong><div id="status">Verificando sessão Google…</div></header><section id="login"><h2>Controle de acesso</h2><p>Este aplicativo utiliza a conta Google autorizada na implantação.</p><div id="loginInfo"></div></section><div id="app"><nav id="nav"></nav><main><article><h2 id="title">Painel</h2><p id="msg">Base Apps Script conectada.</p><pre id="data"></pre></article></main></div><script>function init(){google.script.run.withSuccessHandler(u=>{if(!u.authenticated){document.getElementById('status').textContent='Acesso não autorizado';document.getElementById('loginInfo').innerHTML='<p class="err">'+(u.message||'Conta não autorizada')+'</p><small>Conta detectada: '+(u.email||'indisponível')+'</small>';return;}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('status').textContent='Sessão: '+u.name+' · '+u.role;google.script.run.withSuccessHandler(d=>d.modules.forEach(m=>{let b=document.createElement('button');b.textContent=m;b.onclick=()=>{document.getElementById('title').textContent=m;google.script.run.withSuccessHandler(rows=>document.getElementById('data').textContent=JSON.stringify(rows,null,2)).withFailureHandler(e=>document.getElementById('data').textContent=e.message).listRecords(m)};document.getElementById('nav').appendChild(b)})).getInitialData();}).getCurrentUser();}init();</script></div></body></html>
